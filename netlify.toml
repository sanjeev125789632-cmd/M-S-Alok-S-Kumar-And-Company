# ==========================================================================
# Netlify configuration — M/S Alok S Kumar And Company
# Canonical origin: https://www.alokskumar.com  (HTTPS + www)
#
# Use this file OR the plain-text `_redirects` file, not both — if both are
# present, rules in netlify.toml are evaluated before those in _redirects.
# Netlify serves /path/index.html for /path/ automatically ("Pretty URLs"),
# so no rewrite rule is needed for clean URLs. HTTPS is forced automatically
# once the certificate is provisioned.
#
# For non-www -> www: in the Netlify UI set www.alokskumar.com as the
# PRIMARY domain under Domain management. Netlify then 301s the apex domain
# to www for you — that is the supported way to do it and is preferred over
# a manual rule.
# ==========================================================================

[build]
  publish = "."

# --------------------------------------------------------------------------
# Belt-and-braces host canonicalisation (only fires if the UI primary-domain
# redirect is not in effect, e.g. when an old domain still points here).
# --------------------------------------------------------------------------
[[redirects]]
  from = "https://alokskumar.com/*"
  to = "https://www.alokskumar.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://alokskumarandco.com/*"
  to = "https://www.alokskumar.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.alokskumarandco.com/*"
  to = "https://www.alokskumar.com/:splat"
  status = 301
  force = true

# --------------------------------------------------------------------------
# Legacy paths from the old single-page site
# --------------------------------------------------------------------------
